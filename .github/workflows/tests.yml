name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          # Matches the version the project is developed and verified against.
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest agent/tests -v

      # The unit tests cover agent/, not the HTTP layer, so this catches a broken
      # server entrypoint that the suite alone would miss.
      - name: Smoke check that the API app imports
        run: python -c "import backend.main; print('backend imports OK')"
