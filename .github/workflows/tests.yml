name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }}
    strategy:
      # Run every version to completion so one failure does not hide the others.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -v

      # The unit tests cover agent/, not the HTTP layer, so this catches a broken
      # server entrypoint that the suite alone would miss.
      - name: Smoke check that the API app imports
        run: python -c "import backend.main; print('backend imports OK')"
